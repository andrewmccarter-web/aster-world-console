<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ASTER — Reedwater Miniature</title><style>body{margin:0;background:#101d25;color:#f2e6c9;font:15px system-ui}header{position:absolute;z-index:1;top:15px;left:20px;pointer-events:none}small{color:#c3b89c}canvas{display:block;touch-action:none}footer{position:absolute;bottom:15px;left:20px;font-size:12px;color:#ddd0af}</style></head><body><header><strong>ASTER / REEDWATER</strong><div><small>Provisional 3D landscape • drag to rotate • pinch to zoom</small></div></header><footer>Visual prototype only — not canonical geography</footer><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const s=new T.Scene();s.background=new T.Color('#101d25');const c=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,150);c.position.set(16,15,20);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(r.domElement);s.add(new T.HemisphereLight(0xdbeeff,0x624a31,2.1));let sun=new T.DirectionalLight(0xffd3a0,3);sun.position.set(-5,14,7);s.add(sun);function mat(color){return new T.MeshStandardMaterial({color,roughness:.9})}let green=mat('#72886a'),sand=mat('#c7a77a'),water=new T.MeshStandardMaterial({color:'#39858d',roughness:.27,metalness:.12}),rock=mat('#6e7168'),wood=mat('#806449'),roof=mat('#a88b68');function mesh(g,m,x,y,z){let a=new T.Mesh(g,m);a.position.set(x,y,z);s.add(a);return a}mesh(new T.CylinderGeometry(10.6,10.1,1.1,8),rock,0,-1,0);mesh(new T.CylinderGeometry(10.2,10.4,.4,8),sand,0,-.28,0);let geo=new T.PlaneGeometry(19,19,90,90);geo.rotateX(-Math.PI/2);let p=geo.attributes.position;function river(x){return Math.sin(x*.48)*1.8}for(let i=0;i<p.count;i++){let x=p.getX(i),z=p.getZ(i),d=Math.abs(z-river(x));let h=.35+.5*Math.sin(x*.35)*Math.cos(z*.41)+.35*Math.sin(x*.8+z*.5);h-=Math.max(0,2.5-d)*.65;p.setY(i,h)}geo.computeVertexNormals();mesh(geo,green,0,0,0);for(let x=-9;x<9;x+=.35){let z=river(x),a=mesh(new T.BoxGeometry(.48,.035,2.7),water,x,.035,z);a.rotation.y=-.4*Math.cos(x*.48)}for(let i=0;i<90;i++){let x=Math.sin(i*12.989)*8.6,z=Math.cos(i*7.173)*8.5;if(Math.abs(z-river(x))<2.4)continue;let h=.35+.5*Math.sin(x*.35)*Math.cos(z*.41)+.35*Math.sin(x*.8+z*.5);let trunk=mesh(new T.CylinderGeometry(.07,.12,.65,5),wood,x,h+.33,z);let leaf=mesh(new T.ConeGeometry(.38,.95,6),mat(i%3?'#526e59':'#8d9a6b'),x,h+1,z)}for(let i=0;i<12;i++){let x=-6+(i%4)*2.2,z=3+Math.floor(i/4)*1.6;if(Math.abs(z-river(x))<2)continue;let h=.35+.5*Math.sin(x*.35)*Math.cos(z*.41)+.35*Math.sin(x*.8+z*.5);mesh(new T.CylinderGeometry(.15,.17,.9,6),wood,x-.35,h+.45,z-.35);mesh(new T.CylinderGeometry(.15,.17,.9,6),wood,x+.35,h+.45,z+.35);mesh(new T.BoxGeometry(1.25,.55,.95),wood,x,h+1,z);let a=mesh(new T.ConeGeometry(.92,.7,4),roof,x,h+1.62,z);a.rotation.y=Math.PI/4}let theta=.7,phi=.9,dist=29,down=false,lastX=0,lastY=0;function update(){c.position.set(dist*Math.sin(phi)*Math.sin(theta),dist*Math.cos(phi),dist*Math.sin(phi)*Math.cos(theta));c.lookAt(0,0,0)}update();r.domElement.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;r.domElement.setPointerCapture(e.pointerId)});r.domElement.addEventListener('pointermove',e=>{if(!down)return;theta-=(e.clientX-lastX)*.007;phi=Math.max(.2,Math.min(1.5,phi+(e.clientY-lastY)*.007));lastX=e.clientX;lastY=e.clientY;update()});r.domElement.addEventListener('pointerup',()=>down=false);r.domElement.addEventListener('wheel',e=>{dist=Math.max(12,Math.min(55,dist+e.deltaY*.02));update()},{passive:true});let pinch=0;r.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(12,Math.min(55,dist*pinch/d));pinch=d;update()}else pinch=0},{passive:true});r.domElement.addEventListener('touchend',()=>pinch=0);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);r.render(s,c)}loop();</script></body></html>
