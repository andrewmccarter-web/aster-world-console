<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ASTER — Reedwater v0.4</title><style>*{box-sizing:border-box}body{margin:0;background:#101b22;color:#f1e5c9;font:14px system-ui}header{position:absolute;z-index:2;top:env(safe-area-inset-top,0px);left:0;right:0;padding:18px 20px;pointer-events:none;text-shadow:0 2px 8px #101b22}strong{letter-spacing:.15em}small{display:block;opacity:.8;margin-top:5px}footer{position:absolute;z-index:2;bottom:calc(12px + env(safe-area-inset-bottom));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}button{background:#203f45dd;border:1px solid #9baea4;color:#f6e7cb;border-radius:18px;padding:9px 13px;font:inherit}#info{font-size:11px;color:#e5d7b8;max-width:55%}canvas{display:block;touch-action:none}aside{position:absolute;z-index:4;right:12px;top:82px;width:min(290px,calc(100vw - 24px));background:#142a32ed;border:1px solid #8da5a1;border-radius:14px;padding:14px;box-shadow:0 10px 30px #0008}aside[hidden]{display:none}aside h2{font-size:17px;margin:0 0 8px}aside p{line-height:1.45;margin:8px 0}aside small{font-size:11px}#close{float:right}</style></head><body><header><strong>ASTER / REEDWATER</strong><small>Miniature landscape · v0.4 · ecology study</small></header><aside id='panel' hidden><button id='close' aria-label='Close details'>×</button><h2 id='featureTitle'>Feature</h2><small id='status'>PROVISIONAL</small><p id='description'></p><small>Research status: no verified species or settlement identity assigned. Wiki linkage pending.</small></aside><footer><span id="info">Drag to orbit · pinch to zoom · flora forms unassigned and provisional</span><button id="reset">Reset view</button></footer><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const scene=new T.Scene();const selectable=[];scene.background=new T.Color('#172630');scene.fog=new T.FogExp2('#172630',.012);const camera=new T.PerspectiveCamera(43,innerWidth/innerHeight,.1,130);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xc2dce4,0x75543d,2.5));const sun=new T.DirectionalLight(0xffd4a1,3.2);sun.position.set(-7,16,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;sun.shadow.bias=-.0005;scene.add(sun);const material=(c,r=1)=>new T.MeshStandardMaterial({color:c,roughness:r});const turf=material('#677c59'),soil=material('#79624a'),stone=material('#5c6866'),shore=material('#b5a27a'),timber=material('#756049'),roof=material('#a88d65'),water=new T.MeshStandardMaterial({color:'#397b83',roughness:.24,metalness:.15,transparent:true,opacity:.89});function add(geometry,mat,x,y,z,shadow=true){const o=new T.Mesh(geometry,mat);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}function rand(n){let t=Math.sin(n*127.1+31.7)*43758.5453;return t-Math.floor(t)}function channel(x){return Math.sin(x*.47)*1.6+.35*Math.sin(x*1.1)}function elevation(x,z){const d=Math.abs(z-channel(x));let h=.42+.55*Math.sin(x*.3+.4)*Math.cos(z*.37)+.19*Math.sin(x*1.18+z*.71)+.12*Math.cos(z*1.4-x*.33);h-=Math.max(0,2.5-d)*.45;return h}add(new T.CylinderGeometry(10.6,10.3,1.1,12),stone,0,-1.15,0);add(new T.CylinderGeometry(10.35,10.55,.24,12),soil,0,-.5,0);const geo=new T.PlaneGeometry(19,19,100,100);geo.rotateX(-Math.PI/2);const p=geo.attributes.position;const cols=[];const c1=new T.Color();for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),d=Math.abs(z-channel(x)),h=elevation(x,z);p.setY(i,h);c1.set(d<1.5?'#a49a72':d<2.4?'#88966a':'#657b58');c1.multiplyScalar(.9+rand(i)*.18);cols.push(c1.r,c1.g,c1.b)}geo.setAttribute('color',new T.Float32BufferAttribute(cols,3));geo.computeVertexNormals();add(geo,new T.MeshStandardMaterial({vertexColors:true,roughness:1}),0,0,0,false);for(let i=0;i<130;i++){const x=-9.1+i*.14,z=channel(x),width=1.7+rand(i)*.3;const a=add(new T.BoxGeometry(.24,.028,width*2),water,x,-.31,z,false);a.rotation.y=-Math.atan(.75*Math.cos(x*.47)+.385*Math.cos(x*1.1))}for(let i=0;i<105;i++){let x=(rand(i+19)-.5)*18,z=(rand(i+307)-.5)*18;if(x*x+z*z>82||Math.abs(z-channel(x))<2.4)continue;let h=elevation(x,z),s=.55+rand(i+60)*.85;add(new T.CylinderGeometry(.07*s,.12*s,.8*s,5),timber,x,h+.39*s,z);let foliage=material(['#597a73','#8d8a65','#957b74','#57756b'][i%4]);const a=add(new T.IcosahedronGeometry(.43*s,1),foliage,x,h+1.05*s,z);a.scale.set(1.45,.58,1.25);a.userData.feature='flora';selectable.push(a);for(let k=0;k<5;k++){let angle=k*Math.PI*2/5;let b=add(new T.ConeGeometry(.16*s,.85*s,5),foliage,x+Math.cos(angle)*.28*s,h+1.28*s,z+Math.sin(angle)*.28*s);b.rotation.z=Math.cos(angle)*.48;b.rotation.x=Math.sin(angle)*.48}}for(let i=0;i<110;i++){let x=(rand(i+550)-.5)*18,z=(rand(i+800)-.5)*18;if(x*x+z*z>82||Math.abs(z-channel(x))<1.5)continue;let h=elevation(x,z),s=.1+rand(i+120)*.23;const a=add(new T.IcosahedronGeometry(s,0),i%3?stone:shore,x,h+s*.5,z);a.scale.set(1.3,.65,1)}for(let i=0;i<11;i++){let x=-6.8+(i%4)*2.25,z=3.2+Math.floor(i/4)*2.0;if(Math.abs(z-channel(x))<2.6||x*x+z*z>78)continue;let h=elevation(x,z),scale=.7+rand(i+900)*.4;for(let dx of [-.42,.42])for(let dz of [-.34,.34])add(new T.CylinderGeometry(.055,.07,.95,6),timber,x+dx*scale,h+.47,z+dz*scale);add(new T.BoxGeometry(1.35*scale,.63*scale,1.08*scale),timber,x,h+1.14*scale,z);const top=add(new T.ConeGeometry(.99*scale,.77*scale,4),roof,x,h+1.81*scale,z);top.rotation.y=Math.PI/4;top.userData.feature='structure';selectable.push(top)}for(let i=0;i<42;i++){const x=(rand(i+1300)-.5)*17,z=(rand(i+1450)-.5)*17;if(x*x+z*z>78||Math.abs(z-channel(x))<1.9)continue;const y=elevation(x,z),sc=.25+rand(i+1500)*.35;for(let k=0;k<6;k++){const a=k*Math.PI/3;const leaf=add(new T.SphereGeometry(.24*sc,7,5),material(i%2?'#a88b76':'#829a86'),x+Math.cos(a)*.25*sc,y+.18*sc,z+Math.sin(a)*.25*sc);leaf.scale.set(1.7,.48,.75);leaf.rotation.y=-a}}const pedestal=add(new T.CylinderGeometry(11.1,11.1,.12,12),material('#283b3c'),0,-1.78,0);const raycaster=new T.Raycaster(),pointer=new T.Vector2();const panel=document.getElementById('panel');document.getElementById('close').onclick=()=>panel.hidden=true;let tapStart=null;renderer.domElement.addEventListener('pointerdown',e=>{tapStart={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!tapStart||Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>9)return;const bounds=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-bounds.left)/bounds.width*2-1,-(e.clientY-bounds.top)/bounds.height*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(selectable,false)[0];if(!hit)return;const flora=hit.object.userData.feature==='flora';document.getElementById('featureTitle').textContent=flora?'Unassigned botanical form':'Raised settlement structure';document.getElementById('status').textContent='PROVISIONAL — VISUAL STUDY';document.getElementById('description').textContent=flora?'A speculative plant form. Not yet matched to a named ASTER species or its anatomical record.':'A speculative raised building. Species accessibility, material supply, construction and settlement location have not been validated.';panel.hidden=false});let theta=.72,phi=.96,dist=29;function update(){camera.position.set(dist*Math.sin(phi)*Math.sin(theta),dist*Math.cos(phi),dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(0,-.2,0)}update();let active=new Map(),last=null,pinch=0;renderer.domElement.addEventListener('pointerdown',e=>{active.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;active.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...active.values()];if(pts.length>=2){let d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(pinch)dist=Math.max(13,Math.min(48,dist*pinch/d));pinch=d}else if(last){theta-=(e.clientX-last.x)*.007;phi=Math.max(.18,Math.min(1.52,phi+(e.clientY-last.y)*.007));last={x:e.clientX,y:e.clientY}}update()});function release(e){active.delete(e.pointerId);last=null;pinch=0}renderer.domElement.addEventListener('pointerup',release);renderer.domElement.addEventListener('pointercancel',release);renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(13,Math.min(48,dist+e.deltaY*.02));update()},{passive:true});document.getElementById('reset').onclick=()=>{theta=.72;phi=.96;dist=29;update()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>renderer.render(scene,camera));</script></body></html>
